[workspace]
resolver = "2"
members = ["crates/embr-format", "crates/embr-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/EmberGuild-Labs/embr"

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
zstd = { version = "0.13", features = ["zstdmt"] }
xz2 = "0.1"
walkdir = "2"
clap = { version = "4", features = ["derive"] }
filetime = "0.2"
num_cpus = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
